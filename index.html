  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

color: var(--gold);\n    border: 1px solid var(--gold-light);\n    padding: 10px 24px;\n    text-decoration: none;\n    transition: background 0.25s, color 0.25s;\n  }\n  .nav-cta:hover { background: var(--gold); color: #fff; }\n\n  /* ── SECTIONS ── */\n  section { padding: 96px 5vw; }\n  .inner { max-width: 960px; margin: 0 auto; }\n  .inner-wide { max-width: 1160px; margin: 0 auto; }\n\n  .rule-top { border-top: 1px solid var(--rule); }\n  .bg-stone { background: var(--stone); }\n  .bg-slate { background: var(--slate); color: var(--cream); }\n\n  /* ── LABELS ── */\n  .section-label {\n    font-family: var(--sans);\n    font-size: 0.68rem;\n    letter-spacing: 0.28em;\n    text-transform: uppercase;\n    color: var(--gold);\n    display: block;\n    margin-bottom: 28px;\n  }\n  .bg-slate .section-label { color: var(--gold-light); }\n\n  /* ── HEADINGS ── */\n  h1 {\n    font-family: var(--serif);\n    font-size: clamp(2.6rem, 5vw, 4.2rem);\n    font-weight: 400;\n    line-height: 1.15;\n    letter-spacing: -0.01em;\n    color: var(--slate);\n    text-wrap: pretty;\n  }\n  h2 {\n    font-family: var(--serif);\n    font-size: clamp(1.9rem, 3.2vw, 2.8rem);\n    font-weight: 400;\n    line-height: 1.2;\n    letter-spacing: -0.01em;\n    color: var(--slate);\n    text-wrap: pretty;\n  }\n  .bg-slate h2 { color: var(--cream); }\n  h3 {\n    font-family: var(--serif);\n    font-size: 1.35rem;\n    font-weight: 500;\n    line-height: 1.3;\n    color: var(--slate);\n    margin-bottom: 10px;\n  }\n\n  /* ── BODY TEXT ── */\n  .lead {\n    font-size: 1.05rem;\n    line-height: 1.8;\n    color: var(--slate-mid);\n    max-width: 640px;\n    text-wrap: pretty;\n  }\n  .bg-slate .lead { color: oklch(75% 0.008 240); }\n\n  p { color: var(--slate-mid); line-height: 1.75; text-wrap: pretty; }\n\n  /* ── BUTTONS ── */\n  .btn-primary {\n    display: inline-block;\n    font-family: var(--sans);\n    font-weight: 400;\n    font-size: 0.82rem;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: #fff;\n    background: var(--slate);\n    padding: 16px 40px;\n    text-decoration: none;\n    transition: background 0.25s;\n    border: 1px solid transparent;\n    cursor: pointer;\n  }\n  .btn-primary:hover { background: var(--slate-mid); }\n  .btn-gold {\n    display: inline-block;\n    font-family: var(--sans);\n    font-weight: 400;\n    font-size: 0.82rem;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: #fff;\n    background: var(--gold);\n    padding: 16px 40px;\n    text-decoration: none;\n    transition: background 0.25s;\n    cursor: pointer;\n  }\n  .btn-gold:hover { background: oklch(57% 0.08 78); }\n\n  /* ── HERO ── */\n  #hero {\n    padding-top: 160px;\n    padding-bottom: 100px;\n    border-bottom: 1px solid var(--rule);\n  }\n  .hero-grid {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 80px;\n    align-items: end;\n  }\n  @media (max-width: 760px) {\n    .hero-grid { grid-template-columns: 1fr; gap: 48px; }\n  }\n  .hero-left {}\n  .hero-mention {\n    display: inline-flex;\n    align-items: center;\n    gap: 10px;\n    font-size: 0.75rem;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--slate-light);\n    margin-top: 36px;\n  }\n  .hero-mention::before {\n    content: '';\n    display: block;\n    width: 24px; height: 1px;\n    background: var(--gold);\n  }\n  .hero-right {\n    display: flex;\n    flex-direction: column;\n    gap: 0;\n  }\n  .hero-stat {\n    padding: 28px 0;\n    border-top: 1px solid var(--rule);\n  }\n  .hero-stat:last-child { border-bottom: 1px solid var(--rule); }\n  .hero-stat-num {\n    font-family: var(--serif);\n    font-size: 2.4rem;\n    font-weight: 300;\n    color: var(--slate);\n    display: block;\n    line-height: 1;\n    margin-bottom: 4px;\n  }\n  .hero-stat-label {\n    font-size: 0.78rem;\n    color: var(--slate-light);\n    letter-spacing: 0.06em;\n  }\n\n  /* ── PROBLEMS ── */\n  .problem-list {\n    list-style: none;\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 0;\n    margin-top: 52px;\n    border-top: 1px solid var(--rule);\n  }\n  @media (max-width: 640px) { .problem-list { grid-template-columns: 1fr; } }\n  .problem-list li {\n    padding: 28px 32px 28px 0;\n    border-bottom: 1px solid var(--rule);\n    display: flex;\n    align-items: flex-start;\n    gap: 16px;\n    font-size: 0.93rem;\n    color: var(--slate-mid);\n    line-height: 1.6;\n  }\n  .problem-list li:nth-child(even) {\n    padding-left: 32px;\n    border-left: 1px solid var(--rule);\n    padding-right: 0;\n  }\n  .problem-icon {\n    flex-shrink: 0;\n    width: 20px; height: 20px;\n    color: var(--gold);\n    margin-top: 2px;\n  }\n\n  /* ── SOLUTION ── */\n  .solution-text {\n    font-family: var(--serif);\n    font-size: clamp(1.25rem, 2vw, 1.65rem);\n    line-height: 1.55;\n    font-weight: 400;\n    color: var(--cream);\n    max-width: 720px;\n    margin-top: 28px;\n  }\n\n  /* ── BENEFITS ── */\n  .benefits-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 1px;\n    background: var(--rule);\n    margin-top: 52px;\n    border: 1px solid var(--rule);\n  }\n  @media (max-width: 720px) { .benefits-grid { grid-template-columns: 1fr 1fr; } }\n  @media (max-width: 480px) { .benefits-grid { grid-template-columns: 1fr; } }\n  .benefit-card {\n    background: var(--cream);\n    padding: 36px 32px;\n    display: flex;\n    flex-direction: column;\n    gap: 12px;\n  }\n  .benefit-icon {\n    width: 36px; height: 36px;\n    color: var(--gold);\n    margin-bottom: 4px;\n  }\n  .benefit-card h3 {\n    font-size: 1.05rem;\n    font-family: var(--serif);\n    font-weight: 500;\n  }\n  .benefit-card p {\n    font-size: 0.85rem;\n    line-height: 1.65;\n    color: var(--slate-light);\n  }\n\n  /* ── TESTIMONIAL ── */\n  .testimonial-block {\n    margin-top: 52px;\n    padding: 48px;\n    border: 1px solid var(--rule);\n    background: var(--cream);\n    position: relative;\n  }\n  .quote-mark {\n    font-family: var(--serif);\n    font-size: 8rem;\n    line-height: 0.6;\n    color: var(--gold-light);\n    position: absolute;\n    top: 32px; left: 40px;\n    pointer-events: none;\n    user-select: none;\n  }\n  .testimonial-text {\n    font-family: var(--serif);\n    font-size: clamp(1.1rem, 1.8vw, 1.4rem);\n    font-style: italic;\n    line-height: 1.65;\n    color: var(--slate);\n    padding-left: 16px;\n    margin-top: 28px;\n    max-width: 680px;\n  }\n  .testimonial-sig {\n    margin-top: 24px;\n    padding-top: 20px;\n    border-top: 1px solid var(--rule);\n    font-size: 0.8rem;\n    letter-spacing: 0.1em;\n    text-transform: uppercase;\n    color: var(--slate-light);\n    padding-left: 16px;\n  }\n  .case-intro { max-width: 640px; margin-top: 16px; }\n\n  /* ── STEPS ── */\n  .steps-list {\n    list-style: none;\n    display: flex;\n    flex-direction: column;\n    margin-top: 52px;\n  }\n  .step-item {\n    display: grid;\n    grid-template-columns: 64px 1fr;\n    gap: 0;\n    border-top: 1px solid var(--rule);\n    padding: 28px 0;\n    align-items: start;\n  }\n  .step-item:last-child { border-bottom: 1px solid var(--rule); }\n  .step-num {\n    font-family: var(--serif);\n    font-size: 1.8rem;\n    font-weight: 300;\n    color: var(--gold);\n    line-height: 1;\n    padding-top: 4px;\n  }\n  .step-content h3 {\n    font-size: 1rem;\n    font-family: var(--sans);\n    font-weight: 500;\n    letter-spacing: 0.03em;\n    margin-bottom: 4px;\n    color: var(--slate);\n  }\n  .step-content p { font-size: 0.88rem; color: var(--slate-light); }\n\n  /* ── SETUP STEPS ── */\n  .setup-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 1px;\n    background: var(--rule);\n    margin-top: 52px;\n    border: 1px solid var(--rule);\n  }\n  @media (max-width: 720px) { .setup-grid { grid-template-columns: 1fr 1fr; } }\n  .setup-step {\n    background: var(--stone);\n    padding: 32px 28px;\n  }\n  .setup-num {\n    font-family: var(--serif);\n    font-size: 2rem;\n    font-weight: 300;\n    color: var(--gold);\n    display: block;\n    margin-bottom: 12px;\n    line-height: 1;\n  }\n  .setup-step h3 {\n    font-size: 0.95rem;\n    font-family: var(--sans);\n    font-weight: 500;\n    color: var(--slate);\n    margin-bottom: 6px;\n  }\n  .setup-step p { font-size: 0.83rem; color: var(--slate-light); }\n\n  /* ── OFFER ── */\n  .offer-box {\n    border: 1px solid var(--rule);\n    padding: 60px;\n    margin-top: 52px;\n    background: var(--cream);\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 60px;\n    align-items: start;\n  }\n  @media (max-width: 680px) {\n    .offer-box { grid-template-columns: 1fr; gap: 40px; padding: 40px 28px; }\n  }\n  .offer-price {\n    font-family: var(--serif);\n    font-size: clamp(2.4rem, 4vw, 3.6rem);\n    font-weight: 300;\n    color: var(--slate);\n    line-height: 1;\n    margin: 16px 0 6px;\n  }\n  .offer-price-label {\n    font-size: 0.78rem;\n    color: var(--slate-light);\n    letter-spacing: 0.08em;\n    text-transform: uppercase;\n  }\n  .offer-note {\n    font-size: 0.78rem;\n    color: var(--slate-light);\n    margin-top: 20px;\n    font-style: italic;\n  }\n  .offer-list {\n    list-style: none;\n    display: flex;\n    flex-direction: column;\n    gap: 0;\n  }\n  .offer-list li {\n    display: flex;\n    align-items: flex-start;\n    gap: 14px;\n    padding: 13px 0;\n    border-bottom: 1px solid var(--rule);\n    font-size: 0.88rem;\n    color: var(--slate-mid);\n    line-height: 1.5;\n  }\n  .offer-list li:first-child { border-top: 1px solid var(--rule); }\n  .check-icon { flex-shrink: 0; width: 16px; height: 16px; color: var(--gold); margin-top: 3px; }\n\n  /* ── CTA FINAL ── */\n  #cta-final {\n    text-align: center;\n    padding: 112px 5vw;\n  }\n  #cta-final h2 { max-width: 700px; margin: 0 auto; }\n  #cta-final .lead { margin: 28px auto; text-align: left; max-width: 520px; }\n  .cta-actions {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 14px;\n    margin-top: 40px;\n  }\n  .cta-sub {\n    font-size: 0.78rem;\n    color: var(--slate-light);\n    letter-spacing: 0.06em;\n  }\n\n  /* ── FOOTER ── */\n  footer {\n    border-top: 1px solid var(--rule);\n    padding: 36px 5vw;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 24px;\n    flex-wrap: wrap;\n  }\n  .footer-logo {\n    font-family: var(--serif);\n    font-size: 0.9rem;\n    letter-spacing: 0.2em;\n    text-transform: uppercase;\n    color: var(--slate-light);\n  }\n  .footer-copy {\n    font-size: 0.75rem;\n    color: var(--slate-light);\n    letter-spacing: 0.04em;\n  }\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- NAV -->\n<nav>\n  <div class=\"nav-logo\" style=\"display:flex; align-items:center; gap:14px;\">\n    <img src=\"5c02ba90-ddd4-4e45-80f7-ae8e56abe699\" alt=\"Albertas Notaires\" style=\"height:38px; width:auto; display:block;\">\n    <div style=\"border-left:1px solid var(--rule); padding-left:14px;\">\n      Albertas Notaires\n      <span>Étude notariale<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <a href=\"#cta-final\" class=\"nav-cta\">Demander une démonstration<\u002Fa>\n<\u002Fnav>\n\n\n<!-- 1. HERO -->\n<section id=\"hero\">\n  <div class=\"inner-wide\">\n    <div class=\"hero-grid\">\n      <div class=\"hero-left\">\n        <span class=\"section-label\">Standard intelligent &amp; Agent vocal IA<\u002Fspan>\n        <h1>Ne perdez plus aucune information client, même en dehors des horaires<\u002Fh1>\n        <p class=\"lead\" style=\"margin-top:28px;\">Un standard intelligent qui répond aux appels, génère des résumés automatiques et vous permet de suivre chaque demande avec précision.<\u002Fp>\n        <div style=\"margin-top:40px; display:flex; gap:16px; flex-wrap:wrap; align-items:center;\">\n          <a href=\"#cta-final\" class=\"btn-primary\">Voir une démonstration<\u002Fa>\n
